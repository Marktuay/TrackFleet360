name: Deploy Backend API to Server A

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server A via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SERVER_A_SSH_KEY }}
          script: |
            cd /var/www/trackfleet360
            git pull origin main
            cd backend
            go build -o trackfleet360-backend ./cmd/api
            sudo systemctl restart trackfleet360-backend
