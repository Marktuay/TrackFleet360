name: Deploy Frontend Next.js to Server B

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server B via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SERVER_B_SSH_KEY }}
          script: |
            cd /var/www/trackfleet360
            git pull origin main
            cd frontend
            npm install
            NEXT_PUBLIC_API_URL=https://api.trackfleet360.com/api/v1 npm run build
            sudo systemctl restart trackfleet360-frontend
